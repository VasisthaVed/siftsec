[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-spm"
version = "0.1.0"
description = "AI Security Posture Management (AI-SPM) Scanner for Cloud AI Workloads, Vector DBs, Model Weights & Agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI-SPM Contributors" }
]
keywords = [
    "ai-security",
    "cspm",
    "ai-spm",
    "llm-security",
    "rag-security",
    "sagemaker",
    "bedrock",
    "safetensors",
    "mitre-atlas",
    "owasp-llm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
k8s = [
    "kubernetes>=29.0.0",
]
gcp = [
    "google-cloud-storage>=2.16.0",
    "google-cloud-aiplatform>=1.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "moto[all]>=5.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
tensorguard = "ai_spm.cli:app"
ai-spm = "ai_spm.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
