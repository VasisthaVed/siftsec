[package]
name = "siftsec-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
siftsec-core = { path = "../siftsec-core" }

[[bin]]
name = "json_stream"
path = "fuzz_targets/json_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dedup"
path = "fuzz_targets/dedup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph"
path = "fuzz_targets/graph.rs"
test = false
doc = false
bench = false
