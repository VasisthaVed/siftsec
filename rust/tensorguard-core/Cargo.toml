[package]
name = "tensorguard-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
name = "_tg_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = [] } # Never enable unbounded_depth (ADR-023)
serde_stacker = "0.1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "unwind" is the default — DO NOT set panic = "abort" (ADR-021).
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bench]]
name = "sarif_parse"
harness = false
