name: Rust Gates

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "rust/**"
      - "deny.toml"
      - ".github/workflows/rust-gates.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_id }} # yamllint disable-line rule:context-access
  cancel-in-progress: true

jobs:
  changes:
    name: detect-rust-changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Rust files or workflow changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qE '^(rust/|deny\.toml$|\.github/workflows/rust-gates\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  rust-test-and-audit:
    name: cargo test + deny (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88 (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/siftsec-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/siftsec-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Rust formatting (cargo fmt)
        working-directory: rust/siftsec-core
        run: cargo fmt --all -- --check

      - name: Run cargo test --release
        working-directory: rust/siftsec-core
        run: cargo test --release

      - name: Run cargo clippy (warnings = errors)
        working-directory: rust/siftsec-core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check licenses & advisories (cargo-deny · ADR-035)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/siftsec-core/Cargo.toml

      # cargo-geiger: verify zero unsafe in our own crate outside pyo3 boundary (ADR-036)
      - name: Install cargo-geiger
        if: runner.os == 'Linux'
        run: cargo install cargo-geiger --version 0.13.0 --locked

      - name: Check own-code unsafe (cargo-geiger · ADR-036)
        if: runner.os == 'Linux'
        working-directory: rust/siftsec-core
        run: cargo geiger --output-format Json > ../../geiger.json

      - name: Upload cargo-geiger report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: geiger.json

  rust-gate-aggregate:
    name: rust-gate-aggregate
    runs-on: ubuntu-latest
    needs: [rust-test-and-audit]
    if: always()
    steps:
      - name: Fail if any Rust gate failed
        run: |
          echo '${{ toJSON(needs) }}' | python -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = [k for k, v in needs.items() if v['result'] in ('failure', 'cancelled')]
          if bad:
              print('Blocked by:', bad)
              sys.exit(1)
          print('All Rust gates passed or skipped')
          "
