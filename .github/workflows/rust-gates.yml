name: Rust Gates

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "rust/**"
      - "deny.toml"
      - ".github/workflows/rust-gates.yml"
  pull_request:
    paths:
      - "rust/**"
      - "deny.toml"

jobs:
  rust-test-and-audit:
    name: cargo test + deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88 (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/siftsec-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/siftsec-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cargo test --release
        working-directory: rust/siftsec-core
        run: cargo test --release

      - name: Run cargo clippy (warnings = errors)
        working-directory: rust/siftsec-core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check licenses & advisories (cargo-deny · ADR-035)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/siftsec-core/Cargo.toml

      # cargo-geiger: verify zero unsafe in our own crate outside pyo3 boundary (ADR-036)
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Check own-code unsafe (cargo-geiger · ADR-036)
        run: cargo geiger --output-format Json --manifest-path rust/siftsec-core/Cargo.toml > geiger.json

      - name: Upload cargo-geiger report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-geiger-report
          path: geiger.json
