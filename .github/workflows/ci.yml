name: Siftsec CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Rust toolchain (for Rust-path parity tests)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Build and install Rust extension wheel
        run: |
          pip install maturin
          maturin build --release --strip \
            --manifest-path rust/siftsec-core/Cargo.toml \
            --out dist
          uv pip install --force-reinstall dist/siftsec_core-*.whl

      - name: Run Ruff lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy strict type check
        run: uv run mypy siftsec

      - name: Run full pytest suite (including Rust parity)
        run: uv run pytest --cov=siftsec --cov-report=term-missing -v

      - name: Generate demo SARIF report
        run: uv run siftsec scan --demo --output siftsec-demo.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: siftsec-demo.sarif
        continue-on-error: true

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: siftsec-sarif
          path: siftsec-demo.sarif
          if-no-files-found: ignore
